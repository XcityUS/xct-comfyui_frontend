[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# The Dockerfile builds from the whole repo (`COPY . .` + `pnpm build:cloud`),
# so any tracked file can change the output. Watch everything rather than a
# curated list, which would silently skip relevant changes.
watchPatterns = ["**"]

[deploy]
# Override any stale dashboard start command (e.g. a leftover `pnpm ... dev`)
# with a single-token script so Railway doesn't mangle shell syntax; the
# script renders the nginx config and serves the built static site.
startCommand = "/docker-start.sh"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
