[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Override any stale dashboard start command (e.g. a leftover `pnpm ... dev`)
# so the Dockerfile's nginx entrypoint runs to serve the built static site.
startCommand = "echo \"DIAG PORT=[$PORT]\"; envsubst '${PORT}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf; echo '---DIAG CONFIG START---'; cat /etc/nginx/conf.d/default.conf; echo '---DIAG CONFIG END---'; nginx -t; nginx -g 'daemon off;'"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
