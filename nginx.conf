server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the ComfyUI backend at request time (Railway private DNS first,
    # then Docker's embedded DNS for local runs). Using a variable in
    # proxy_pass defers resolution so nginx still starts if the host is down.
    resolver fd12::10 127.0.0.11 valid=10s;

    # WebSocket channel for graph execution updates.
    location /ws {
        set $comfyui_backend ${COMFYUI_BACKEND_ORIGIN};
        proxy_pass $comfyui_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Same-origin proxy to the ComfyUI backend: REST API, node extension
    # scripts, workflow templates, internal routes, and media views.
    location ~ ^/(api|internal|extensions|templates|view|docs)(/|$) {
        set $comfyui_backend ${COMFYUI_BACKEND_ORIGIN};
        proxy_pass $comfyui_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
        proxy_read_timeout 600s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
