server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # motion.xcity.ai is a pure TokenHub media product: the SPA talks to the
    # gateway (tokenhub) cross-origin and needs no backend proxy. Serving only
    # the static build keeps the ComfyUI backend off this origin entirely.
    #
    # The HTML shell must always be revalidated: hashed assets above are
    # immutable for a year, so a stale index.html would keep pinning old chunk
    # filenames (e.g. a pre-migration build whose identity host was still
    # xcity.one) and users would never pick up new deploys. no-cache lets the
    # browser store it but forces a 304 check every load.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
