# Basic abuse damping for the unauthenticated proxy surface
# (http-context directives; this file is included from conf.d).
limit_req_zone $binary_remote_addr zone=comfyui_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=comfyui_conn:10m;

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the ComfyUI backend at request time. nginx round-robins across
    # listed resolvers, so template the real one per environment (Railway
    # private DNS by default). Using a variable in proxy_pass defers
    # resolution so nginx still starts if the host is down.
    resolver ${COMFYUI_DNS_RESOLVER} valid=30s;

    # WebSocket channel for graph execution updates.
    location = /ws {
        set $comfyui_backend ${COMFYUI_BACKEND_ORIGIN};
        proxy_pass $comfyui_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Same-origin proxy to the ComfyUI backend: REST API, node extension
    # scripts, workflow templates, embedded node docs, and media views.
    # /internal is intentionally NOT proxied (filesystem disclosure routes;
    # the cloud-distribution frontend does not need it).
    location ~ ^/(api|extensions|templates|view|docs)(/|$) {
        set $comfyui_backend ${COMFYUI_BACKEND_ORIGIN};
        limit_req zone=comfyui_api burst=60 nodelay;
        limit_conn comfyui_conn 20;
        proxy_pass $comfyui_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64m;
        proxy_read_timeout 600s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated: hashed assets above are
    # immutable for a year, so a stale index.html would keep pinning old chunk
    # filenames and users would never pick up new deploys. no-cache lets the
    # browser store it but forces a 304 check every load.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
