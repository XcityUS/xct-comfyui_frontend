server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # motion.xcity.ai is a pure TokenHub media product: the SPA talks to the
    # gateway (tokenhub) cross-origin and needs no backend proxy. Serving only
    # the static build keeps the ComfyUI backend off this origin entirely.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
